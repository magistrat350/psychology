name: App bauen & veröffentlichen

# Bei jedem Push: alle Tests, danach Android-APK bauen und im Android-Emulator testen.
# Auf dem Standard-Branch zusätzlich (nur wenn der Emulator-Test bestanden ist):
#   - GitHub-Release v<major>.<minor>.<Laufnummer> mit der APK und Screenshots – die installierte App erkennt es
#     und bietet das Update an
#   - Web-Version auf GitHub Pages (sobald unter Settings → Pages die Quelle „GitHub Actions“ gewählt ist)
# Versionsschema: tools/lib/version.mjs (major.minor aus package.json, Build-Nummer = Laufnummer = Android-versionCode).
on:
  push:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Browser für die Oberflächentests
        run: npx playwright install --with-deps chromium

      - name: npm test
        run: npm test

  android:
    name: Android-APK
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # frühere Release-Tags für die Versionshinweise

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Version bestimmen
        id: version
        run: |
          node tools/version.mjs --env | tee -a "$GITHUB_ENV" | sed 's/^APP_VERSION=/version=/; s/^APP_BUILD=/build=/' >> "$GITHUB_OUTPUT"
          node tools/version.mjs

      - name: Web-App zusammenstellen
        run: node tools/build-web.mjs --android

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Versionsnummer setzen
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $APP_BUILD/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
          grep -q "versionCode $APP_BUILD" android/app/build.gradle
          grep -q "versionName \"$APP_VERSION\"" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: APK kompilieren
        working-directory: android
        run: ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: APK signieren
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "Signiere mit dem Schlüssel aus den Repository-Secrets."
            echo "$KS_B64" | base64 -d > release.jks
            PASS="$KS_PASS"; ALIAS="${KS_ALIAS:-psychopfad}"
          else
            echo "::warning::Keine Signatur-Secrets gesetzt – signiere mit signing/psychopfad.jks aus dem (öffentlichen) Repository."
            cp signing/psychopfad.jks release.jks
            PASS="psychopfad-wien"; ALIAS="psychopfad"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" --key-pass "pass:$PASS" --out psychopfad.apk aligned.apk
          "$BT/apksigner" verify --print-certs psychopfad.apk
          "$BT/aapt2" dump badging psychopfad.apk > badging.txt
          grep -o "versionCode='[0-9]*' versionName='[^']*'" badging.txt
          grep -q "versionCode='$APP_BUILD' versionName='$APP_VERSION'" badging.txt
          cp psychopfad.apk "psychopfad-$APP_VERSION.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          rm -f release.jks aligned.apk badging.txt

      - name: Versionshinweise
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "Änderungen${PREV:+ seit $PREV}:"
            echo
            git log --no-merges -n 30 --pretty='- %s' ${PREV:+$PREV..}HEAD
            echo
            echo "**Installieren:** psychopfad.apk auf dem Android-Handy herunterladen und öffnen. Schon installiert? Einfach drüberinstallieren – dein Lernstand bleibt erhalten."
          } > release-notes.md
          cat release-notes.md

      - name: APKs als Build-Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.APP_VERSION }}
          path: |
            psychopfad.apk
            psychopfad-${{ env.APP_VERSION }}.apk
            app-debug.apk
            release-notes.md

  emulator:
    name: Test im Android-Emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.android.outputs.version }}
      APP_BUILD: ${{ needs.android.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: apk-${{ needs.android.outputs.version }}
          path: apk

      - name: Hardware-Beschleunigung (KVM) aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Debug-APK: WebView per Playwright steuerbar (Ansichten, Plugins, Teilen, Zurück-Taste, Update-Abfrage);
      # Release-APK: Installation, Version, Start ohne Absturz. Details: tests/android-device.mjs
      - name: App im Emulator testen (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node tests/android-device.mjs apk/app-debug.apk apk/psychopfad.apk android-screenshots

      - name: Screenshots speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ needs.android.outputs.version }}
          path: android-screenshots
          if-no-files-found: ignore

  release:
    name: Release veröffentlichen
    needs: [android, emulator]
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.android.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-${{ needs.android.outputs.version }}
          path: apk

      - uses: actions/download-artifact@v4
        with:
          name: screenshots-${{ needs.android.outputs.version }}
          path: shots

      - name: Dateien und Text zusammenstellen
        run: |
          mkdir files
          cp apk/psychopfad.apk "apk/psychopfad-$APP_VERSION.apk" files/
          for f in start quiz lernpfad-quellen rechentrainer einstellungen; do
            if [ -f "shots/$f.png" ]; then cp "shots/$f.png" "files/screenshot-$f.png"; fi
          done
          cp apk/release-notes.md notes.md
          printf '\nGetestet im Android-Emulator (Android 14): Start, Ansichten, Update-Prüfung, Teilen-Menü, Zurück-Taste und Installation der signierten APK. Screenshots aus dem Test hängen an.\n' >> notes.md
          ls -la files

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: PsychoPfad Wien ${{ env.APP_VERSION }}
          make_latest: true
          body_path: notes.md
          files: files/*

  pages:
    name: Web-Version (GitHub Pages)
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # Veröffentlicht erst, wenn GitHub Pages unter Settings → Pages auf „GitHub Actions“ steht.
    # Bis dahin wird der Schritt übersprungen.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web-App zusammenstellen
        run: node tools/build-web.mjs
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
